services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: sgr-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://sgr:sgr_dev_password@postgres:5432/sgr_dev
      REDIS_URL: redis://:sgr_redis_dev@redis:6379
      MINIO_ENDPOINT: http://garage:3900
      MINIO_ACCESS_KEY: GKed5537444c2e84eb01b9fa34
      MINIO_SECRET_KEY: 85dc8299f8dfde6f3ca5549fd3380c799df0c123936bd37795a5d1eb04f55246
      MINIO_BUCKET: sgr-files
      MINIO_USE_SSL: "false"
      MINIO_REGION: garage
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT: "30000"
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY: 7d
      JWT_ISSUER: sgr-api
      SIGNATURE_HMAC_SECRET: dev-hmac-secret-change-in-production
      MAX_FILE_SIZE_MB: "10"
      LOG_LEVEL: debug
    volumes:
      - jwt_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      jwt-keygen:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r => { if(!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sgr-network
      - keycloak-external

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: sgr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/.env.local:/app/packages/frontend/.env.local
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => { if(!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sgr-network

  postgres:
    image: postgres:16-alpine
    container_name: sgr-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sgr
      POSTGRES_PASSWORD: sgr_dev_password
      POSTGRES_DB: sgr_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/backend/src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgr -d sgr_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sgr-network

  redis:
    image: valkey/valkey:8-alpine
    container_name: sgr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass sgr_redis_dev
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sgr_redis_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sgr-network

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: sgr-garage
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./config/garage.toml:/etc/garage.toml:ro
    networks:
      - sgr-network

  garage-init:
    image: alpine:3.19
    container_name: sgr-garage-init
    depends_on:
      - garage
    volumes:
      - ./config/garage-init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    networks:
      - sgr-network

  clamav:
    image: clamav/clamav:stable
    container_name: sgr-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - sgr-network

  jwt-keygen:
    image: alpine:3.19
    container_name: sgr-jwt-keygen
    command: >
      sh -c '
        if [ ! -f /keys/private.pem ]; then
          apk add --no-cache openssl &&
          openssl genrsa -out /keys/private.pem 2048 &&
          openssl rsa -in /keys/private.pem -pubout -out /keys/public.pem &&
          chmod 644 /keys/*.pem &&
          echo "JWT keys generated."
        else
          echo "JWT keys already exist, skipping."
        fi
      '
    volumes:
      - jwt_keys:/keys
    networks:
      - sgr-network

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  clamav_data:
  jwt_keys:

networks:
  sgr-network:
    driver: bridge
  keycloak-external:
    name: keycloak-external
    driver: bridge
