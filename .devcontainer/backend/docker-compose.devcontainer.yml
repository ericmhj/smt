services:
  backend-dev:
    # Node 22: requerido por pnpm@9.12.0 (packageManager en package.json).
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    container_name: sgr-backend-dev
    volumes:
      - ../..:/workspace:cached
    command: sleep infinity
    networks:
      # Red interna del devcontainer (postgres, redis, garage, clamav).
      - default
      # Redes compartidas para alcanzar license-kafka, license-app (mikel-net)
      # y keycloak (keycloak-external) en modo integrado.
      - mikel-net
      - keycloak-external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  # Override service names to use Docker internal DNS.
  # Los servicios y sus imágenes se heredan de ../../docker-compose.yml;
  # aquí solo se ajusta la red del devcontainer.
  postgres:
    networks:
      - default

  redis:
    networks:
      - default

  garage:
    networks:
      - default

  garage-init:
    networks:
      - default

  clamav:
    networks:
      - default

networks:
  default:
    name: sgr-dev-network
  # Redes compartidas creadas por los stacks de license-service y Keycloak.
  # Externas: el devcontainer las usa para el modo integrado (Kafka, Keycloak).
  mikel-net:
    name: mikel-net
    external: true
  keycloak-external:
    name: keycloak-external
    external: true
