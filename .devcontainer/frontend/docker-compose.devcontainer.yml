version: "3.9"

services:
  frontend-dev:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    container_name: sgr-frontend-dev
    volumes:
      - ../..:/workspace:cached
    command: sleep infinity
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    networks:
      - sgr-dev-network

networks:
  sgr-dev-network:
    external: true
    name: sgr-dev-network
